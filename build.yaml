# build.yaml

# Configuration for build_runner

targets:
  $default:
    builders:
      # Hive Generator runs only on its specific files
      hive_generator:
        enabled: true
        generate_for:
          - lib/features/**/models/hive/**_hive_model.dart

      # Configure injectable_generator
      injectable_generator:injectable_config_builder:
        enabled: true
        generate_for:
          include:
            - lib/**/*.dart
          exclude:
            - lib/features/**/models/hive/**_hive_model.dart
            - test/** # Exclude ALL test files
            - lib/features/auth/example/** # Keep excluding the example dir just in case

      injectable_generator:injectable_builder:
        enabled: true
        generate_for:
          include:
            - lib/**/*.dart
          exclude:
            - lib/features/**/models/hive/**_hive_model.dart
            - test/**

      # Configure json_serializable
      json_serializable:
        enabled: true
        generate_for:
          include:
            - lib/**/*.dart
          exclude:
            - lib/features/**/models/hive/**_hive_model.dart
            - lib/features/auth/example/**
            - test/** # Also exclude test directory for json_serializable

      # Configure riverpod_generator
      riverpod_generator:riverpod_generator:
        enabled: true
        generate_for:
          include:
            - lib/**/*.dart
          exclude:
            - lib/features/**/models/hive/**_hive_model.dart
            - lib/features/auth/example/**
            - test/**

      # 确保其他需要的生成器也在这里配置或保持默认
      # ...
