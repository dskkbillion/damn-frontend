# 微信支付配置文件
# 注意：敏感信息（如App ID、Universal Link）优先从环境变量读取
# 环境变量配置项：WECHAT_APP_ID, WECHAT_UNIVERSAL_LINK, PAYMENT_ENVIRONMENT, PAYMENT_MOCK_ENABLED

# 支付环境
environment: "production"  # 可被环境变量 PAYMENT_ENVIRONMENT 覆盖

# 测试模式 (开发调试使用)
mock_payment: false  # 可被环境变量 PAYMENT_MOCK_ENABLED 覆盖

# 显示配置
display:
  name: "微信支付"
  icon: "wechat"
  color: "#07c160"
  description: "安全便捷的移动支付"

# App配置（敏感信息已移至环境变量）
app_config:
  # 使用占位符，实际值从环境变量 WECHAT_APP_ID 读取
  app_id: "wx_placeholder_use_env_var"
  # 使用占位符，实际值从环境变量 WECHAT_UNIVERSAL_LINK 读取
  universal_link: "https://placeholder.use.env.var/wechat/"

# 支持的支付场景
payment_scenes:
  - "order"      # 订单支付
  - "vip"        # 会员升级
  - "wallet"     # 钱包充值

# 支持的支付类型
payment_types:
  - "app"        # 微信APP支付
  # - mini_program  # 小程序支付（如需要）
  # - h5            # H5支付（如需要） 