<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSKK - 卖家指南</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <div class="back-button" onclick="window.history.back()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="header-title">卖家指南</div>
            <div class="header-right"></div>
        </div>
        
        <!-- 目录 -->
        <div class="guide-toc" id="guideToc">
            <div class="toc-title">目录</div>
            <div class="toc-items">
                <div class="toc-item" onclick="scrollToSection('section1')">
                    <span class="toc-number">1</span>
                    <span class="toc-text">成为卖家</span>
                </div>
                </div>
            </div>
        </div>
        
        <!-- 指南内容 -->
        <div class="guide-content">
            <!-- 第一章节 -->
            <div class="guide-section" id="section1">
                <div class="section-header">
                    <div class="section-number">1</div>
                    <div class="section-title">成为卖家</div>
                </div>
                
                <div class="section-content">
                    <p>成为DSKK平台的卖家，您需要完成以下步骤：</p>
                    
                    <div class="step-item">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <div class="step-title">注册账号</div>
                            <div class="step-description">
                                使用手机号注册DSKK账号，或使用已有账号登录。
                            </div>
                        </div>
                    </div>
                    
                    <div class="step-item">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <div class="step-title">完善个人资料</div>
                            <div class="step-description">
                                上传头像，填写昵称、个人简介和专业技能等信息。
                            </div>
                        </div>
                    </div>
                    
                    <div class="step-item">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <div class="step-title">实名认证</div>
                            <div class="step-description">
                                提交身份证信息进行实名认证，确保账号安全和交易可靠。
                            </div>
                        </div>
                    </div>
                    
                    <div class="step-item">
                        <div class="step-number">4</div>
                        <div class="step-content">
                            <div class="step-title">专业认证（可选）</div>
                            <div class="step-description">
                                提交相关证书、作品集或学历证明，获得专业认证标识，提高信任度。
                            </div>
                        </div>
                    </div>
                    
                    <div class="step-item">
                        <div class="step-number">5</div>
                        <div class="step-content">
                            <div class="step-title">绑定银行卡</div>
                            <div class="step-description">
                                绑定银行卡，用于收款和提现。
                            </div>
                        </div>
                    </div>
                    
                    <div class="note-box">
                        <div class="note-title">
                            <i class="fas fa-info-circle"></i>
                            <span>注意事项</span>
                        </div>
                        <div class="note-content">
                            实名认证信息必须真实有效，一旦发现虚假信息，账号将被永久封禁。
                        </div>
                    </div>
                </div>
            </div>
