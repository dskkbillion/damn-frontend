<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动回复设置</title>
    <link rel="stylesheet" href="../../../../styles.css">
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        
        .back-button {
            display: flex;
            align-items: center;
        }
        
        .back-button i {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .back-button span {
            font-size: 18px;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: bold;
        }
        
        .auto-reply-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 15px;
            padding: 0 15px;
        }
        
        .auto-reply-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .auto-reply-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .auto-reply-desc {
            font-size: 14px;
            color: #999;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #B66D0E;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .textarea-container {
            padding: 0 15px;
            flex-grow: 1;
        }
        
        .auto-reply-textarea {
            width: 100%;
            height: 40%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
            background-color: #fff;
        }
        
        .submit-button {
            background-color: #caa472;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 30px;
            align-self: center;
            cursor: pointer;
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-button" onclick="history.back()">
                <i>←</i>
                <span>返回</span>
            </div>
            <div class="header-title">自动回复设置</div>
            <div style="width: 24px;"></div> <!-- 占位元素，保持标题居中 -->
        </div>
        
        <div class="auto-reply-header">
            <div class="auto-reply-info">
                <h2 class="auto-reply-title">自动回复</h2>
                <p class="auto-reply-desc">所有服务默认自动回复</p>
            </div>
            
            <label class="switch">
                <input type="checkbox" id="auto-reply-switch" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="textarea-container">
            <textarea class="auto-reply-textarea" id="auto-reply-content" placeholder="设置自动回复的内容">您好，感谢您的咨询。我现在暂时不在线，稍后会回复您的消息，请耐心等待。</textarea>
        </div>
        
        <div class="button-container">
            <button class="submit-button" id="submit-button">提交修改</button>
        </div>
    </div>
    
    <script>
        // 获取元素
        const autoReplySwitch = document.getElementById('auto-reply-switch');
        const autoReplyContent = document.getElementById('auto-reply-content');
        const submitButton = document.getElementById('submit-button');
        
        // 提交按钮点击事件
        submitButton.addEventListener('click', function() {
            const content = autoReplyContent.value.trim();
            
            if (content === '') {
                alert('设置内容不能为空');
                return;
            }
            
            // 这里可以添加AJAX请求来保存设置
            alert('设置成功');
        });
        
        // 开关状态变化事件
        autoReplySwitch.addEventListener('change', function() {
            // 这里可以添加AJAX请求来保存开关状态
            alert(`自动回复已${this.checked ? '开启' : '关闭'}`);
        });
    </script>
</body>
</html>
