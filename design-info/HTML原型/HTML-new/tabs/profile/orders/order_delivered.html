<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSKK - 买家已交付订单</title>
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="../../../css/order_delivered.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部导航栏 -->
        <div class="header">
            <div class="back-button" onclick="window.location.href='orders.html'">
                <i class="fas fa-chevron-left"></i>
            </div>
        </div>
        
        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-steps">
                <div class="progress-line"></div>
                <div class="step completed">
                    <i class="fas fa-check step-icon"></i>
                </div>
                <div class="step completed">
                    <i class="fas fa-check step-icon"></i>
                </div>
                <div class="step completed">
                    <i class="fas fa-check step-icon"></i>
                </div>
                <div class="step completed">
                    <i class="fas fa-check step-icon"></i>
                </div>
                <div class="step pending">
                </div>
                <div class="step pending">
                </div>
            </div>
            <div class="step-labels">
                <div class="step-label">已支付</div>
                <div class="step-label">已提交</div>
                <div class="step-label">已接单</div>
                <div class="step-label">已交付</div>
                <div class="step-label">待确认</div>
                <div class="step-label">待评价</div>
            </div>
        </div>
        
        <!-- 内容区域 -->
        <div class="content-container">
            <!-- 状态卡片 -->
            <div class="status-card">
                <div class="status-title">等待确认</div>
                <div class="status-description">
                    卖家已完成交付，请确认是否收货。0时0分0秒后，如您仍未确认收货，系统将自动收货，如订单有问题请联系卖家或申请平台介入
                </div>
            </div>
            
            <!-- 申请部分 -->
            <div class="request-section">
                <div class="request-header" onclick="toggleRequest()">
                    <div class="request-title">你的申请</div>
                    <div class="request-info">本服务包含3次交付次数，现已交付1次</div>
                    <div class="request-toggle">
                        <i class="fas fa-chevron-down" id="requestIcon"></i>
                    </div>
                </div>
                <div class="request-note">交付次数内的申请将会被自动处理</div>
            </div>
            
            <!-- 交付部分 -->
            <div class="delivery-section">
                <div class="delivery-header" onclick="toggleDelivery()">
                    <div class="delivery-title">交付 #1</div>
                    <div class="delivery-date"></div>
                    <div class="delivery-toggle">
                        <i class="fas fa-chevron-up" id="deliveryIcon"></i>
                    </div>
                </div>
                <div class="delivery-content" id="deliveryContent">
                    <div class="delivery-text">文本内容</div>
                    <div class="delivery-file">
                        <a href="#" class="file-link">http://dummyimage.com/500x1000</a>
                        <a href="#" class="download-button">下载</a>
                    </div>
                    <div class="delivery-file">
                        <a href="#" class="file-link">http://dummyimage.com/500x1000</a>
                        <a href="#" class="download-button">下载</a>
                    </div>
                    <div class="file-count">2个文件</div>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="unsatisfied-button" onclick="showUnsatisfiedOptions()">对交付不满意？</button>
                <button class="confirm-button" onclick="confirmDelivery()">确认收货580</button>
            </div>
        </div>
    </div>

    <script>
        // 切换申请显示/隐藏
        function toggleRequest() {
            const icon = document.getElementById('requestIcon');
            
            if (icon.classList.contains('fa-chevron-down')) {
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            } else {
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        }
        
        // 切换交付内容显示/隐藏
        function toggleDelivery() {
            const content = document.getElementById('deliveryContent');
            const icon = document.getElementById('deliveryIcon');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            } else {
                content.style.display = 'none';
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        }
        
        // 显示不满意选项
        function showUnsatisfiedOptions() {
            window.location.href = 'order_refund.html';
        }
        
        // 确认收货
        function confirmDelivery() {
            alert('您已确认收货，订单已完成');
        }
    </script>
</body>
</html>
