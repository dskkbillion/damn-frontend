<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSKK - 搜索</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部搜索栏 -->
        <div class="search-header">
            <div class="search-input-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="搜索服务..." autofocus>
            </div>
            <div class="cancel-button" onclick="window.location.href='index.html'">
                取消
            </div>
        </div>
        
        <!-- 内容区域 -->
        <div class="content">
            <!-- 热搜榜 -->
            <div class="search-section">
                <div class="section-title">热搜榜</div>
                <div class="hot-search-list">
                    <!-- 这里可以添加热搜项目 -->
                </div>
            </div>
            
            <!-- 搜索历史 -->
            <div class="search-section">
                <div class="section-header">
                    <div class="section-title">搜索历史</div>
                    <div class="clear-history" onclick="clearHistory()">
                        <i class="fas fa-trash"></i>
                    </div>
                </div>
                <div class="history-list">
                    <div class="history-item" onclick="searchWithKeyword('托福辅导')">
                        托福辅导
                    </div>
                    <div class="history-item" onclick="searchWithKeyword('雅思写作')">
                        雅思写作
                    </div>
                    <div class="history-item" onclick="searchWithKeyword('留学申请')">
                        留学申请
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* 搜索页面特定样式 */
        .search-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--primary-color);
        }
        
        .search-input-container {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 20px;
            padding: 8px 16px;
            margin-right: 12px;
        }
        
        .search-icon {
            color: var(--text-secondary);
            margin-right: 8px;
        }
        
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }
        
        .cancel-button {
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        
        .search-section {
            margin-bottom: 24px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .clear-history {
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
        }
        
        .history-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .hot-search-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .hot-search-item {
            background-color: var(--bg-light);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>

    <script>
        function searchWithKeyword(keyword) {
            console.log('搜索关键词:', keyword);
            // 实际应用中，这里会跳转到搜索结果页面
            window.location.href = 'search_result.html?keyword=' + encodeURIComponent(keyword);
        }
        
        function clearHistory() {
            console.log('清除搜索历史');
            // 实际应用中，这里会清除搜索历史记录
            document.querySelector('.history-list').innerHTML = '';
        }
        
        // 监听搜索框输入事件
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const keyword = this.value.trim();
                if (keyword) {
                    searchWithKeyword(keyword);
                }
            }
        });
    </script>
</body>
</html>
