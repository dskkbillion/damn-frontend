<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSKK - 卖家订单搜索</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/seller_order_search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <div class="back-button" onclick="window.location.href='seller_orders.html'">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="header-title">订单搜索</div>
            <div class="header-right"></div>
        </div>
        
        <!-- 搜索表单 -->
        <div class="search-container">
            <div class="search-form">
                <div class="form-group">
                    <label for="orderNumber">订单号</label>
                    <input type="text" id="orderNumber" placeholder="请输入订单号">
                </div>
                
                <div class="form-group">
                    <label for="orderStatus">订单状态</label>
                    <select id="orderStatus">
                        <option value="">全部</option>
                        <option value="pending">待确认</option>
                        <option value="inProgress">进行中</option>
                        <option value="delivered">已交付</option>
                        <option value="afterSale">售后</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="orderTime">订单时间</label>
                    <div class="date-range">
                        <input type="date" id="startDate" placeholder="开始日期">
                        <span class="date-separator">至</span>
                        <input type="date" id="endDate" placeholder="结束日期">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="buyerName">买家名称</label>
                    <input type="text" id="buyerName" placeholder="请输入买家名称">
                </div>
            </div>
            
            <div class="search-buttons">
                <button class="reset-button" onclick="resetForm()">重置</button>
                <button class="search-button" onclick="searchOrders()">搜索</button>
            </div>
        </div>
    </div>

    <script src="js/seller_order_search.js"></script>
</body>
</html>
