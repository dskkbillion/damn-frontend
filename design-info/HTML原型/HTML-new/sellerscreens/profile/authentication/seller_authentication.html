<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSKK - 认证管理</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <div class="back-button" onclick="window.location.href='seller_profile.html'">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="header-title">认证管理</div>
            <div class="header-right"></div>
        </div>
        
        <!-- 认证管理内容 -->
        <div class="auth-container">
            <!-- 已认证项目 -->
            <div class="auth-section">
                <div class="section-title">已认证项目</div>
                
                <!-- 实名认证 -->
                <div class="auth-item" onclick="viewAuthDetail('identity')">
                    <div class="auth-name">实名认证</div>
                    <div class="auth-status pending">待审核</div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                
                <!-- 公司认证 -->
                <div class="auth-item" onclick="viewAuthDetail('company')">
                    <div class="auth-name">公司认证</div>
                    <div class="auth-status approved">申请通过</div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                
                <!-- 学校认证 -->
                <div class="auth-item" onclick="viewAuthDetail('school')">
                    <div class="auth-name">学校认证</div>
                    <div class="auth-status pending">待审核</div>
                    <i class="fas fa-chevron-right"></i>
                </div>
                
                <!-- 实名认证 -->
                <div class="auth-item" onclick="viewAuthDetail('identity2')">
                    <div class="auth-name">实名认证</div>
                    <div class="auth-status approved">申请通过</div>
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <!-- 开放认证 -->
            <div class="auth-section">
                <div class="section-title">开放认证...</div>
                
                <div class="auth-grid">
                    <!-- 公司认证 -->
                    <div class="auth-grid-item" onclick="applyAuth('company')">
                        <div class="auth-icon company-icon">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="auth-label">公司认证</div>
                    </div>
                    
                    <!-- 学历认证 -->
                    <div class="auth-grid-item" onclick="applyAuth('education')">
                        <div class="auth-icon education-icon">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <div class="auth-label">学历认证</div>
                    </div>
                    
                    <!-- 实名认证 -->
                    <div class="auth-grid-item" onclick="applyAuth('identity')">
                        <div class="auth-icon identity-icon">
                            <i class="fas fa-id-card"></i>
                        </div>
                        <div class="auth-label">实名认证</div>
                    </div>
                    
                    <!-- 其他 -->
                    <div class="auth-grid-item" onclick="showMoreAuth()">
                        <div class="auth-icon other-icon">
                            <i class="fas fa-plus"></i>
                        </div>
                        <div class="auth-label">其他</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 更多认证弹窗 -->
        <div class="modal" id="moreAuthModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">更多认证类型</div>
                    <div class="modal-close" onclick="closeModal('moreAuthModal')">
                        <i class="fas fa-times"></i>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="more-auth-list">
                        <!-- 职业认证 -->
                        <div class="more-auth-item" onclick="applyAuth('profession')">
                            <div class="auth-icon profession-icon">
                                <i class="fas fa-briefcase"></i>
                            </div>
                            <div class="auth-info">
                                <div class="auth-title">职业认证</div>
                                <div class="auth-desc">证明您的职业身份，提高专业可信度</div>
                            </div>
                        </div>
                        
                        <!-- 技能认证 -->
                        <div class="more-auth-item" onclick="applyAuth('skill')">
                            <div class="auth-icon skill-icon">
                                <i class="fas fa-tools"></i>
                            </div>
                            <div class="auth-info">
                                <div class="auth-title">技能认证</div>
                                <div class="auth-desc">展示您的专业技能和资格证书</div>
                            </div>
                        </div>
                        
                        <!-- 作品集认证 -->
                        <div class="more-auth-item" onclick="applyAuth('portfolio')">
                            <div class="auth-icon portfolio-icon">
                                <i class="fas fa-images"></i>
                            </div>
                            <div class="auth-info">
                                <div class="auth-title">作品集认证</div>
                                <div class="auth-desc">展示您的优秀作品和项目经验</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* 认证管理页面特定样式 */
        .auth-container {
            padding: 16px;
            background-color: var(--bg-light);
        }
        
        .auth-section {
            background-color: white;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        /* 已认证项目样式 */
        .auth-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
        }
        
        .auth-item:last-child {
            border-bottom: none;
        }
        
        .auth-name {
            flex: 1;
            font-size: 16px;
        }
        
        .auth-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 8px;
        }
        
        .auth-status.pending {
            background-color: #fff3e0;
            color: #ff9800;
        }
        
        .auth-status.approved {
            background-color: #e8f5e9;
            color: #4caf50;
        }
        
        .auth-status.rejected {
            background-color: #ffebee;
            color: #f44336;
        }
        
        /* 开放认证样式 */
        .auth-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        
        .auth-grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        
        .auth-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 24px;
            color: white;
        }
        
        .company-icon {
            background-color: #2196f3;
        }
        
        .education-icon {
            background-color: #4caf50;
        }
        
        .identity-icon {
            background-color: #ff9800;
        }
        
        .other-icon {
            background-color: #9e9e9e;
        }
        
        .profession-icon {
            background-color: #673ab7;
        }
        
        .skill-icon {
            background-color: #00bcd4;
        }
        
        .portfolio-icon {
            background-color: #e91e63;
        }
        
        .auth-label {
            font-size: 12px;
            text-align: center;
        }
        
        /* 模态框样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            width: 90%;
            max-width: 320px;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
        }
        
        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }
        
        .modal-close {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .modal-body {
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        /* 更多认证列表样式 */
        .more-auth-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .more-auth-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            background-color: var(--bg-light);
            cursor: pointer;
        }
        
        .more-auth-item .auth-icon {
            margin-right: 16px;
            margin-bottom: 0;
        }
        
        .auth-info {
            flex: 1;
        }
        
        .auth-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .auth-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>

    <script>
        // 查看认证详情
        function viewAuthDetail(authType) {
            window.location.href = `seller_authentication_status.html?type=${authType}`;
        }
        
        // 申请认证
        function applyAuth(authType) {
            window.location.href = `seller_authentication_detail.html?type=${authType}`;
        }
        
        // 显示更多认证
        function showMoreAuth() {
            document.getElementById('moreAuthModal').style.display = 'flex';
        }
        
        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // 点击弹窗外部关闭弹窗
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('moreAuthModal');
            
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
